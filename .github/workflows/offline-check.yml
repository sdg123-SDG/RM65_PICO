name: Offline simulation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/doctor.py --offline
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
      - run: python scripts/make_xr_test_fixture.py
      - run: python scripts/teleop_rm65_xrt.py --replay logs/xr/synthetic_replay_fixture.jsonl --headless
